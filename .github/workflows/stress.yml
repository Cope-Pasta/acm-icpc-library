name: Stress

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run stress tests
        run: make stress
