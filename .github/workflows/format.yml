name: Format

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the version: different clang-format releases format differently
      - name: Install clang-format
        run: pip install clang-format==19.1.7

      - name: Check formatting
        run: make format-check
