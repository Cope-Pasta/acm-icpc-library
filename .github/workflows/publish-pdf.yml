name: Publish PDF

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf

      # Rolling "latest" release that always points at the newest master build
      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest main.pdf \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Automatically built from ${GITHUB_SHA::7}." \
            --prerelease

      # Versioned release for pushed tags like v1.0
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.pdf \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
